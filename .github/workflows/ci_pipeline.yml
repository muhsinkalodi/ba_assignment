name: EV Transition Analytics CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code Repository
      uses: actions/checkout@v4

    - name: Set up Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Set up R Environment
      uses: r-lib/actions/setup-r@v2

    - name: Install System Utilities (Chafa)
      run: |
        sudo apt-get update
        sudo apt-get install -y chafa

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Install R Dependencies
      run: |
        Rscript -e "install.packages(c('ggplot2', 'dplyr'), repos='https://cloud.r-project.org/')"

    - name: Download Sample Dataset for CI Testing
      run: |
        mkdir -p data/raw
        curl -o data/raw/Electric_Vehicle_Population_Data.csv "https://data.wa.gov/api/views/f6w7-q2d2/rows.csv?accessType=DOWNLOAD"

    - name: Run Data Hygiene & Cleaning Pipeline
      run: python python/data_loader.py

    - name: Run Matplotlib Pipeline
      run: python python/matplotlib_analytics.py

    - name: Run Seaborn Pipeline
      run: python python/seaborn_analytics.py

    - name: Run plotnine Pipeline
      run: python python/plotnine_analytics.py

    - name: Run ggplot2 Analytics Pipeline (R)
      run: Rscript r/ggplot2_analytics.R

    - name: Generate Adoption Animation GIF
      run: python benchmarks/generate_animation.py

    - name: Run Performance Benchmarks
      run: python benchmarks/performance_benchmark.py